<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tendência das Notas</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e3e7eb;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
      padding: 22px 28px 26px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #172033;
    }

    .subtitulo {
      margin: 10px 0 26px;
      font-size: 17px;
      color: #606a78;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 620px;
    }


    .evolucao-resumo {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(4, minmax(190px, 1fr));
      gap: 14px;
    }

    .evolucao-card {
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e3e7eb;
      border-radius: 10px;
      padding: 16px 14px;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .evolucao-card.geral {
      background: #f8fafc;
    }

    .evolucao-card.amarela {
      border-top: 4px solid #f4c20d;
    }

    .evolucao-card.vermelha {
      border-top: 4px solid #f0352b;
    }

    .evolucao-card.nd {
      border-top: 4px solid #879295;
    }

    .evolucao-card.meta {
      border-top: 4px solid #2563eb;
      background: #f8fbff;
    }

    .evolucao-titulo {
      font-size: 14px;
      color: #606a78;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .evolucao-valor {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 5px;
      line-height: 1.15;
    }

    .evolucao-valor.melhora {
      color: #15803d;
    }

    .evolucao-valor.piora {
      color: #dc2626;
    }

    .evolucao-valor.neutro {
      color: #475569;
    }

    .evolucao-valor.meta-valor {
      color: #2563eb;
    }

    .evolucao-detalhe {
      font-size: 13px;
      line-height: 1.35;
      color: #606a78;
    }

    @media (max-width: 1150px) {
      .evolucao-resumo {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }
    }

    @media (max-width: 600px) {
      .evolucao-resumo {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 16px 14px 20px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitulo {
        font-size: 14px;
        margin-bottom: 18px;
      }

      .chart-wrap {
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <section class="card">
    <h1>Tendência das Notas</h1>
    <div class="subtitulo">
      Distribuição das notas Amarelas, Vermelhas e ND por data.
    </div>

    <div class="chart-wrap">
      <canvas id="graficoTendencia"></canvas>
    </div>

    <div class="evolucao-resumo">
      <div class="evolucao-card geral">
        <div class="evolucao-titulo">Evolução geral</div>
        <div id="evolucaoValor" class="evolucao-valor">--</div>
        <div id="evolucaoDetalhe" class="evolucao-detalhe"></div>
      </div>

      <div class="evolucao-card amarela">
        <div class="evolucao-titulo">Evolução Notas Amarelas</div>
        <div id="evolucaoAmarelaValor" class="evolucao-valor">--</div>
        <div id="evolucaoAmarelaDetalhe" class="evolucao-detalhe"></div>
      </div>

      <div class="evolucao-card vermelha">
        <div class="evolucao-titulo">Evolução Notas Vermelhas</div>
        <div id="evolucaoVermelhaValor" class="evolucao-valor">--</div>
        <div id="evolucaoVermelhaDetalhe" class="evolucao-detalhe"></div>
      </div>

      <div class="evolucao-card nd">
        <div class="evolucao-titulo">Evolução Notas ND</div>
        <div id="evolucaoNdValor" class="evolucao-valor">--</div>
        <div id="evolucaoNdDetalhe" class="evolucao-detalhe"></div>
      </div>

    </div>

  </section>

  <script>
    Chart.register(ChartDataLabels);

    const datas = [
      "12/01/1990",
      '12/02/1990',
    ];

    const amarelas = [45, 78];
    const vermelhas = [78, 20];
    const nd = [181, 104];

    // Soma das três categorias em cada data.
    const totais = datas.map((_, i) =>
      amarelas[i] + vermelhas[i] + nd[i]
    );

    // ==========================================================
    // INDICADORES DE EVOLUÇÃO
    // Neste gráfico, MENOS notas = MELHORA.
    // Cada percentual compara a primeira medição com a mais recente.
    // ==========================================================

    const META_MELHORIA = 85; // Meta de redução/melhoria em %

    function calcularEvolucao(valorInicial, valorAtual) {
      if (valorInicial === 0) {
        return valorAtual === 0 ? 0 : null;
      }

      return ((valorInicial - valorAtual) / valorInicial) * 100;
    }

    function formatarPercentual(valor) {
      return valor.toFixed(1).replace(".", ",") + "%";
    }

    function preencherCard(valorId, detalheId, valorInicial, valorAtual) {
      const valorEl = document.getElementById(valorId);
      const detalheEl = document.getElementById(detalheId);
      const percentual = calcularEvolucao(valorInicial, valorAtual);

      valorEl.classList.remove("melhora", "piora", "neutro");

      if (percentual === null) {
        valorEl.textContent = "Não calculável";
        valorEl.classList.add("neutro");
      } else if (percentual > 0) {
        valorEl.textContent = "↓ " + formatarPercentual(percentual) + " de melhora";
        valorEl.classList.add("melhora");
      } else if (percentual < 0) {
        valorEl.textContent = "↑ " + formatarPercentual(Math.abs(percentual)) + " de piora";
        valorEl.classList.add("piora");
      } else {
        valorEl.textContent = "0,0% — sem alteração";
        valorEl.classList.add("neutro");
      }

      detalheEl.textContent = "De " + valorInicial + " notas" + " para " + valorAtual + " notas";

      return percentual;
    }

    const primeiroTotal = totais[0];
    const ultimoTotal = totais[totais.length - 1];

    const percentualEvolucao = preencherCard(
      "evolucaoValor",
      "evolucaoDetalhe",
      primeiroTotal,
      ultimoTotal
    );

    preencherCard(
      "evolucaoAmarelaValor",
      "evolucaoAmarelaDetalhe",
      amarelas[0],
      amarelas[amarelas.length - 1]
    );

    preencherCard(
      "evolucaoVermelhaValor",
      "evolucaoVermelhaDetalhe",
      vermelhas[0],
      vermelhas[vermelhas.length - 1]
    );

    preencherCard(
      "evolucaoNdValor",
      "evolucaoNdDetalhe",
      nd[0],
      nd[nd.length - 1]
    );

    const ctx = document.getElementById("graficoTendencia");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: datas,
        datasets: [
          {
            type: "line",
            label: "Linha de Tendência",
            data: totais,
            borderColor: "#e10000",
            backgroundColor: "#e10000",
            borderWidth: 3,
            borderDash: [8, 6],
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: "#e10000",
            pointBorderColor: "#e10000",
            tension: 0.15,
            fill: false,
            order: 0,
            datalabels: {
              display: true,
              align: "top",
              anchor: "end",
              offset: 3,
              color: "#1f2937",
              font: {
                size: 13,
                weight: "bold"
              },
              formatter: value => value
            }
          },
          {
            label: "Amarela",
            data: amarelas,
            backgroundColor: "#f4c20d",
            borderColor: "#f4c20d",
            borderWidth: 1,
            borderRadius: 2,
            categoryPercentage: 0.72,
            barPercentage: 0.88,
            order: 1,
            datalabels: {
              display: true,
              anchor: "end",
              align: "top",
              color: "#1f2937",
              font: {
                size: 12,
                weight: "bold"
              },
              formatter: value => value
            }
          },
          {
            label: "Vermelha",
            data: vermelhas,
            backgroundColor: "#f0352b",
            borderColor: "#f0352b",
            borderWidth: 1,
            borderRadius: 2,
            categoryPercentage: 0.72,
            barPercentage: 0.88,
            order: 1,
            datalabels: {
              display: true,
              anchor: "end",
              align: "top",
              color: "#1f2937",
              font: {
                size: 12,
                weight: "bold"
              },
              formatter: value => value
            }
          },
          {
            label: "ND",
            data: nd,
            backgroundColor: "#879295",
            borderColor: "#879295",
            borderWidth: 1,
            borderRadius: 2,
            categoryPercentage: 0.72,
            barPercentage: 0.88,
            order: 1,
            datalabels: {
              display: true,
              anchor: "end",
              align: "top",
              color: "#1f2937",
              font: {
                size: 12,
                weight: "bold"
              },
              formatter: value => value
            }
          }
        ]
      },

      options: {
        responsive: true,
        maintainAspectRatio: false,

        interaction: {
          mode: "index",
          intersect: false
        },

        layout: {
          padding: {
            top: 20,
            right: 10,
            left: 0,
            bottom: 0
          }
        },

        plugins: {
          legend: {
            position: "top",
            align: "center",
            labels: {
              boxWidth: 36,
              boxHeight: 14,
              padding: 18,
              font: {
                size: 14
              },
              color: "#4b5563",
              usePointStyle: false
            }
          },

          tooltip: {
            callbacks: {
              footer: function (items) {
                const index = items[0].dataIndex;
                return "Total: " + totais[index];
              }
            }
          }
        },

        scales: {
          x: {
            grid: {
              display: true,
              color: "rgba(90, 100, 110, .16)"
            },
            ticks: {
              color: "#4b5563",
              font: {
                size: 12
              },
              maxRotation: 0,
              minRotation: 0
            },
            title: {
              display: true,
              text: "Data",
              color: "#374151",
              font: {
                size: 15,
                weight: "normal"
              }
            },
            border: {
              color: "#aeb5bd"
            }
          },

          y: {
            beginAtZero: true,
            min: 0,
            max: 500,
            ticks: {
              stepSize: 100,
              color: "#4b5563",
              font: {
                size: 12
              }
            },
            grid: {
              color: "rgba(90, 100, 110, .16)"
            },
            title: {
              display: true,
              text: "Quantidade de notas",
              color: "#374151",
              font: {
                size: 15,
                weight: "normal"
              }
            },
            border: {
              color: "#aeb5bd"
            }
          }
        }
      }
    });
  </script>
</body>

</html>
