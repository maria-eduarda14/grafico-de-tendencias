<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha - Administração</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <h1>Redefinir senha</h1>
      <p>Escolha uma nova senha para sua conta.</p>
      <div id="redefinirAviso" class="notice" role="status" aria-live="polite"></div>
      <form id="redefinirForm" hidden>
        <div class="form-group">
          <label for="novaSenha">Nova senha</label>
          <div class="password-field">
            <input type="password" id="novaSenha" minlength="8" autocomplete="new-password" required />
            <button class="password-toggle" type="button" data-target="novaSenha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarNovaSenha" minlength="8" autocomplete="new-password" required />
        </div>
        <button class="btn btn-primary auth-submit" type="submit">Salvar nova senha</button>
      </form>
      <p class="auth-public-link"><a href="login.html">← Voltar ao login</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
