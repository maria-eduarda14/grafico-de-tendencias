<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Administração</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <h1>Administração</h1>
      <p>Entre para editar os dados do gráfico.</p>
      <div id="loginAviso" class="notice"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Entrar</button>
      </form>
      <p style="margin-top:16px;font-size:13px"><a href="index.html">← Voltar ao gráfico público</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
